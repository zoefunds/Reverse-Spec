name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tooling
        run: pip install genvm-linter genlayer-test pytest
      - name: Lint contract
        # Schema validation currently depends on a retired upstream runner
        # archive; direct contract tests below compile and execute the source.
        run: genvm-lint lint contracts/reverse_spec_bounties.py --json
      - name: Direct contract tests
        run: pytest contracts-tests/direct/ -v

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt pytest
      - name: API tests
        working-directory: backend
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  relayer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/relayer/package-lock.json }
      - name: Install
        working-directory: backend/relayer
        run: npm ci
      - name: Relayer tests
        working-directory: backend/relayer
        run: npm test

  base-escrow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Escrow tests
        working-directory: contracts/base
        run: forge test
