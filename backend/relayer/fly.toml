# Fly.io configuration — Reverse Spec relayer (Base Sepolia <-> GenLayer bridge)
#
# Background poller, no HTTP surface. Runs 24/7 so funding deposits and
# payout settlements get relayed without a human driving it manually.

app = "reverse-spec-production-relayer"
primary_region = "iad"

[build]

[env]
  GENLAYER_NETWORK = "studionet"
  GENLAYER_CONTRACT_ADDRESS = "0x75B9094aCd67bfC450B07fFA07A63b2446260Eaf"
  BASE_SEPOLIA_RPC_URL = "https://sepolia.base.org"
  BASE_SEPOLIA_USDC_ADDRESS = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
  REVERSE_SPEC_ESCROW_ADDRESS = "0x7e83C2136f9C6e259187E737501086bc84EC0595"
  BASE_SEPOLIA_FUNDING_START_BLOCK = "53031221"
  BASE_SEPOLIA_CONFIRMATIONS = "5"
  RELAYER_POLL_INTERVAL_MS = "30000"
  RELAYER_STATE_FILE = "/data/relayer-state.json"
  # Secrets: BASE_SEPOLIA_RELAYER_PRIVATE_KEY and DATABASE_URL.
  # DATABASE_URL provides the cross-instance advisory leadership lease.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "relayer_state"
  destination = "/data"

[processes]
  app = "node index.js"

[[restart]]
  policy = "always"
