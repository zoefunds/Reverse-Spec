# Fly.io configuration — Reverse Spec Bounties API
#
# 24/7 requirement: machines never auto-stop, at least one always running,
# health checks auto-restart unhealthy machines.

app = "reverse-spec-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  ENVIRONMENT = "production"
  GENLAYER_NETWORK = "studionet"
  GENLAYER_CONTRACT_ADDRESS = "0xb5f4C5C4B2162073fc1a0eA7de6EB9E0E9b8037b"
  INDEXER_ENABLED = "true"
  INDEXER_INTERVAL_SECONDS = "120"
  # Secrets (set via `fly secrets set`): DATABASE_URL, JWT_SECRET, CORS_ORIGINS

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"        # never sleep — 24/7
  auto_start_machines = true
  min_machines_running = 1          # always at least one alive

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
