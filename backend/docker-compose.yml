# Local development database (Docker + PostgreSQL, per architecture decision)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reversespec
      POSTGRES_PASSWORD: reversespec
      POSTGRES_DB: reversespec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reversespec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
