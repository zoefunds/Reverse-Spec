<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ReverseSpec mark: a spec bracket mirrored back on itself -->
  <rect width="64" height="64" rx="14" fill="#0b1326"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e5bff"/>
      <stop offset="1" stop-color="#4cd7f6"/>
    </linearGradient>
  </defs>
  <!-- forward bracket (the spec) -->
  <path d="M27 16 L15 32 L27 48" fill="none" stroke="#571bc1"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- reversed bracket (the better problem), leading -->
  <path d="M37 16 L49 32 L37 48" fill="none" stroke="url(#g)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3" fill="#b8c3ff"/>
</svg>
